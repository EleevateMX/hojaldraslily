# Publica la carpeta demo/ en GitHub Pages, para ver las demostraciones
# del POS en el navegador sin clonar nada:
#   https://eleevatemx.github.io/hojaldraslily/
name: Demos a GitHub Pages

on:
  push:
    branches: [claude/pos-venta-inventario-visual-u8l1rj, main]
    paths: ['demo/**', '.github/workflows/pages-demos.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir demo/
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
