# Mantiene GitHub Pages al día: cada cambio en demo/ se publica a la rama
# gh-pages (Pages sirve esa rama en modo clásico).
#   https://eleevatemx.github.io/hojaldraslily/
name: Demos a GitHub Pages

on:
  push:
    branches: [claude/pos-venta-inventario-visual-u8l1rj, main]
    paths: ['demo/**', '.github/workflows/pages-demos.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publicar demo/ a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo
          publish_branch: gh-pages
          commit_message: 'Actualizar demos en Pages'
